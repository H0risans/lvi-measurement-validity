<svg xmlns="http://www.w3.org/2000/svg" width="980" height="360" viewBox="0 0 980 360">
<rect width="980" height="360" fill="#ffffff"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#1f2933">
<text x="30" y="34" font-size="18" fill="#1f2933" font-weight="bold" text-anchor="start">Figure 1. Event-level injection and processing-exposure verification</text>
<rect x="30" y="90" width="150" height="76" rx="6" fill="#f8fafc" stroke="#1f2933" stroke-width="1.4"/>
<text x="105.0" y="122" font-size="14" fill="#1f2933" font-weight="bold" text-anchor="middle">Input stream</text>
<text x="105.0" y="144" font-size="12.5" fill="#6b7280" font-weight="normal" text-anchor="middle">40 Hz images</text>
<rect x="230" y="90" width="170" height="76" rx="6" fill="#f8fafc" stroke="#1f2933" stroke-width="1.4"/>
<text x="315.0" y="122" font-size="14" fill="#1f2933" font-weight="bold" text-anchor="middle">Injector</text>
<text x="315.0" y="144" font-size="12.5" fill="#6b7280" font-weight="normal" text-anchor="middle">drop / saturation / replay</text>
<rect x="450" y="90" width="170" height="76" rx="6" fill="#f8fafc" stroke="#1f2933" stroke-width="1.4"/>
<text x="535.0" y="122" font-size="14" fill="#1f2933" font-weight="bold" text-anchor="middle">Estimator</text>
<text x="535.0" y="144" font-size="12.5" fill="#6b7280" font-weight="normal" text-anchor="middle">10 Hz visual updates</text>
<rect x="660" y="90" width="170" height="76" rx="6" fill="#f8fafc" stroke="#1f2933" stroke-width="1.4"/>
<text x="745.0" y="122" font-size="14" fill="#1f2933" font-weight="bold" text-anchor="middle">Two-stage decision</text>
<text x="745.0" y="144" font-size="12.5" fill="#6b7280" font-weight="normal" text-anchor="middle">OK / degraded / unavailable</text>
<rect x="850" y="90" width="100" height="76" rx="6" fill="#f8fafc" stroke="#1f2933" stroke-width="1.4"/>
<text x="900.0" y="122" font-size="14" fill="#1f2933" font-weight="bold" text-anchor="middle">Output</text>
<text x="900.0" y="144" font-size="12.5" fill="#6b7280" font-weight="normal" text-anchor="middle">hold optional</text>
<line x1="184" y1="128" x2="226" y2="128" stroke="#1f2933" stroke-width="1.6"/><path d="M 226.0,128.0 L 218.7,131.4 L 218.7,124.6 Z" fill="#1f2933"/>
<line x1="404" y1="128" x2="446" y2="128" stroke="#1f2933" stroke-width="1.6"/><path d="M 446.0,128.0 L 438.7,131.4 L 438.7,124.6 Z" fill="#1f2933"/>
<line x1="624" y1="128" x2="656" y2="128" stroke="#1f2933" stroke-width="1.6"/><path d="M 656.0,128.0 L 648.7,131.4 L 648.7,124.6 Z" fill="#1f2933"/>
<line x1="834" y1="128" x2="846" y2="128" stroke="#1f2933" stroke-width="1.6"/><path d="M 846.0,128.0 L 838.7,131.4 L 838.7,124.6 Z" fill="#1f2933"/>
<text x="30" y="226" font-size="14" fill="#1f2933" font-weight="bold" text-anchor="start">Per-event evidence</text>
<rect x="30" y="246" width="230" height="66" rx="4" fill="#fffdf5" stroke="#d97706" stroke-width="1.4" stroke-dasharray="5,4"/>
<text x="145.0" y="273" font-size="13" fill="#1f2933" font-weight="bold" text-anchor="middle">Event table</text>
<text x="145.0" y="294" font-size="11.5" fill="#6b7280" font-weight="normal" text-anchor="middle">action / content age / window</text>
<rect x="290" y="246" width="230" height="66" rx="4" fill="#fffdf5" stroke="#d97706" stroke-width="1.4" stroke-dasharray="5,4"/>
<text x="405.0" y="273" font-size="13" fill="#1f2933" font-weight="bold" text-anchor="middle">Processing exposure</text>
<text x="405.0" y="294" font-size="11.5" fill="#6b7280" font-weight="normal" text-anchor="middle">image log × visual-update log</text>
<rect x="550" y="246" width="250" height="66" rx="4" fill="#fffdf5" stroke="#d97706" stroke-width="1.4" stroke-dasharray="5,4"/>
<text x="675.0" y="273" font-size="13" fill="#1f2933" font-weight="bold" text-anchor="middle">Trajectory metrics</text>
<text x="675.0" y="294" font-size="11.5" fill="#6b7280" font-weight="normal" text-anchor="middle">APE / RPE / null distribution</text>
<rect x="830" y="246" width="120" height="66" rx="4" fill="#fffdf5" stroke="#d97706" stroke-width="1.4" stroke-dasharray="5,4"/>
<text x="890.0" y="273" font-size="13" fill="#1f2933" font-weight="bold" text-anchor="middle">Decision</text>
<text x="890.0" y="294" font-size="11.5" fill="#6b7280" font-weight="normal" text-anchor="middle">independent of indicators</text>
<line x1="305" y1="166" x2="145" y2="246" stroke="#d97706" stroke-width="1.2" stroke-dasharray="4,4"/>
<line x1="525" y1="166" x2="405" y2="246" stroke="#d97706" stroke-width="1.2" stroke-dasharray="4,4"/>
<line x1="735" y1="166" x2="675" y2="246" stroke="#d97706" stroke-width="1.2" stroke-dasharray="4,4"/>
<text x="490" y="336" font-size="12.5" fill="#6b7280" font-weight="normal" text-anchor="middle">A measurable content-anomaly effect requires both: the event reached the estimator, and the trajectory changed beyond the run-to-run null distribution.</text>
</g>
</svg>