# R3LIVE 适配清单（W4c）
system: r3live
algorithm_type: "ESIKF + RGB point cloud"
integration_level: "Level A (external supervisor, read-only topics)"
source:
  repository: "~/catkin_r3live_ws/src/r3live"
  commit: "6143a38537f28cb36eb24e9bbe2e39c8f7967157"
  changes: "none in algorithm core; Hilti22 adapter and launch/remap only"
inputs:
  image: "/r3live_hilti_adapter/image_out (injector select10 -> Hilti adapter, 10 Hz)"
  lidar: "/r3live_hilti_adapter/cloud_out"
  odom: "/aft_mapped_to_init"
decision:
  location: "safety_supervisor (external)"
